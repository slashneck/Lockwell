<?xml version="1.0" encoding="UTF-8"?>
<!--
    Lockwell app icon foreground.

    Built from circles and rectangles only. MAUI rasterises these SVGs with a limited
    renderer that silently produced a blank image when this used arc commands and
    strokes - the app shipped with no icon at all and nothing warned about it. Filled
    primitives are what it handles reliably, so the shackle is a teal ring with its
    lower half covered by the lock body rather than a stroked arc.

    Colours match the desktop app: accent #2DD4BF on background #06080D.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="456" height="456" viewBox="0 0 456 456">

  <!-- Shackle: outer disc, then a dark disc punched out to leave a ring -->
  <circle cx="228" cy="185" r="64" fill="#2DD4BF" />
  <circle cx="228" cy="185" r="38" fill="#06080D" />

  <!-- Body, drawn over the ring's lower half so the shackle reads as an arch -->
  <rect x="138" y="196" width="180" height="152" rx="32" fill="#2DD4BF" />

  <!-- Keyhole -->
  <circle cx="228" cy="258" r="17" fill="#06080D" />
  <rect x="220" y="258" width="16" height="38" rx="8" fill="#06080D" />

</svg>
