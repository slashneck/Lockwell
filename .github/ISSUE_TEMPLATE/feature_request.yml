name: Feature request
description: Suggest something Lockwell should do.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem rather than the solution you have in mind. It
        usually leads somewhere better.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like to happen
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Does this change what Lockwell has to trust?
      description: Anything that adds a network call, writes decrypted data to disk, or
        touches the vault format needs to say so. It does not disqualify the idea.
